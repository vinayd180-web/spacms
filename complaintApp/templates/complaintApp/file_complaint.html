{% extends 'base.html' %}
{% block title %}File Complaint{% endblock %}
{% block content %}
<h2>File Complaint</h2>
{% if messages %}
<div class="alert alert-success">{% for m in messages %}{{ m }}{% endfor %}</div>
{% endif %}
<form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Complaint Title" class="form-control mb-2" required>
    <textarea name="description" placeholder="Describe your complaint" class="form-control mb-2" required></textarea>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
