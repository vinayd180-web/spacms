{% extends 'base.html' %}
{% block title %}Notifications{% endblock %}
{% block content %}
<h2>Notifications</h2>
<table class="table">
    <thead><tr><th>Title</th><th>Message</th><th>Date</th></tr></thead>
    <tbody>
        {% for n in notifications %}
        <tr><td>{{ n.title }}</td><td>{{ n.message }}</td><td>{{ n.created_at }}</td></tr>
        {% empty %}
        <tr><td colspan="3">No notifications.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
