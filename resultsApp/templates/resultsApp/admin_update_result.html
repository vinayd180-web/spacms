{% extends 'base.html' %}
{% block title %}Update Marks{% endblock %}
{% block content %}
<h2>Update Marks</h2>
<form method="post">
    {% csrf_token %}
    <label>Marks</label>
    <input type="number" step="0.01" name="marks" value="{{ result.marks }}" class="form-control" required>
    <label>Grade</label>
    <input type="text" name="grade" value="{{ result.grade }}" class="form-control">
    <label>Remarks</label>
    <textarea name="remarks" class="form-control">{{ result.remarks }}</textarea>
    <button type="submit" class="btn btn-primary mt-2">Update</button>
</form>
{% endblock %}
