[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m venv /app/.venv",
  "/app/.venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "/app/.venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/daphne -b 0.0.0.0 -p $PORT managementProject.asgi:application"
