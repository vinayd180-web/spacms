{% extends 'base.html' %}
{% block title %}Take Quiz{% endblock %}
{% block content %}
<h2>{{ quiz.title }}</h2>
<form method="post">
    {% csrf_token %}
    {% for q in questions %}
    <div class="card mb-3">
        <div class="card-body">
            <p><strong>Q{{ forloop.counter }}:</strong> {{ q.question_text }}</p>
            <label><input type="radio" name="question_{{ q.id }}" value="A"> {{ q.option_a }}</label><br>
            <label><input type="radio" name="question_{{ q.id }}" value="B"> {{ q.option_b }}</label><br>
            <label><input type="radio" name="question_{{ q.id }}" value="C"> {{ q.option_c }}</label><br>
            <label><input type="radio" name="question_{{ q.id }}" value="D"> {{ q.option_d }}</label>
        </div>
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-success">Submit</button>
</form>
{% endblock %}
