{% extends 'base.html' %}
{% block title %}Result{% endblock %}
{% block content %}
<div class="text-center">
    <h2>Quiz Result</h2>
    <h1>{{ percentage|floatformat:2 }}%</h1>
    <p>Score: {{ score }} / {{ total_marks }}</p>
    <a href="{% url 'student_quizzes' %}" class="btn btn-primary">Back to Quizzes</a>
</div>
{% endblock %}
