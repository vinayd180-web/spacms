{% extends 'base.html' %}
{% block title %}Add Questions{% endblock %}
{% block content %}
<h2>Add Questions - {{ quiz.title }}</h2>
<a href="{% url 'import_questions' quiz.id %}" class="btn btn-info mb-3">Import Questions</a>
<form method="post" class="mb-4">
    {% csrf_token %}
    <textarea name="question_text" placeholder="Question" class="form-control mb-2" required></textarea>
    <input type="text" name="option_a" placeholder="Option A" class="form-control mb-2" required>
    <input type="text" name="option_b" placeholder="Option B" class="form-control mb-2" required>
    <input type="text" name="option_c" placeholder="Option C" class="form-control mb-2" required>
    <input type="text" name="option_d" placeholder="Option D" class="form-control mb-2" required>
    <select name="correct_answer" class="form-control mb-2">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
    </select>
    <button type="submit" class="btn btn-primary">Add Question</button>
</form>

<h4>Questions</h4>
{% for q in questions %}
<div class="card mb-2">
    <div class="card-body">
        <p>{{ q.question_text }}</p>
        <small>Correct: {{ q.correct_answer }}</small>
    </div>
</div>
{% endfor %}
{% endblock %}
