{% extends 'base.html' %}
{% block title %}Fees Management{% endblock %}
{% block content %}
<h2>Fees Management</h2>
<table class="table">
    <thead>
        <tr><th>Student</th><th>Amount</th><th>Status</th><th>Due Date</th><th>Action</th></tr>
    </thead>
    <tbody>
        {% for fee in fees_list %}
        <tr>
            <td>{{ fee.student }}</td>
            <td>{{ fee.amount }}</td>
            <td>{{ fee.status }}</td>
            <td>{{ fee.due_date }}</td>
            <td><a href="{% url 'admin_fees_update' fee.id %}" class="btn btn-sm btn-warning">Update</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
