{% extends 'base.html' %}
{% block title %}Mark Attendance{% endblock %}
{% block content %}
<h2>Mark Attendance - {{ classroom }}</h2>
<p>Date: {{ date }}</p>
<form method="post">
    {% csrf_token %}
    <table class="table">
        <thead>
            <tr><th>Student</th><th>Present</th><th>Absent</th><th>Late</th></tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student }}</td>
                <td><input type="radio" name="status_{{ student.id }}" value="present" checked></td>
                <td><input type="radio" name="status_{{ student.id }}" value="absent"></td>
                <td><input type="radio" name="status_{{ student.id }}" value="late"></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-success">Save Attendance</button>
</form>
{% endblock %}
